here<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KATHU_764 CINEMA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0c0c0c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 50px;
    }

    /* Animated Brand Header */
    header {
      padding: 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(20,20,20,0.9), transparent);
    }
    .brand {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff0055, #ff7700, #ff0055);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      animation: neon 3s linear infinite;
    }
    @keyframes neon {
      to { background-position: 200% center; }
    }

    /* Main Video Screen */
    .player-box {
      max-width: 900px;
      margin: 0 auto 15px auto;
      padding: 0 15px;
    }
    .video-frame {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Screen */
      height: 0;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid #222;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .video-frame iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    .now-playing {
      max-width: 900px;
      margin: 10px auto 25px auto;
      padding: 0 18px;
      text-align: left;
    }
    .movie-title {
      font-size: 20px;
      font-weight: bold;
      color: #ff0055;
    }
    .movie-sub {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    /* Movie Selection Gallery */
    .list-title {
      max-width: 900px;
      margin: 20px auto 10px auto;
      padding: 0 18px;
      text-align: left;
      font-size: 17px;
      font-weight: bold;
      border-left: 4px solid #ff0055;
      padding-left: 8px;
    }
    .movie-grid {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
    }
    .movie-card {
      background: #181818;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #252525;
      transition: transform 0.2s, border-color 0.2s;
    }
    .movie-card:active {
      transform: scale(0.96);
      border-color: #ff0055;
    }
    .movie-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .card-details {
      padding: 10px;
      text-align: left;
    }
    .card-name {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-tag {
      font-size: 11px;
      color: #ff0055;
      margin-top: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">KATHU_764</div>
  </header>

  <!-- Player Screen -->
  <div class="player-box">
    <div class="video-frame">
      <!-- ನಿಮ್ಮ ಹಾಡು ನೇರವಾಗಿ ಇಲ್ಲಿ ಲೋಡ್ ಆಗಿದೆ -->
      <iframe id="cinemaPlayer" src="https://www.youtube.com/embed/-E0P159qjwk?autoplay=0" allowfullscreen allow="autoplay"></iframe>
    </div>
  </div>

  <div class="now-playing">
    <div class="movie-title" id="playingTitle">ಮೌನದ ಅಲೆಗಳು (Mouna Nadi)</div>
    <div class="movie-sub" id="playingSub">Kathu_764 Exclusive • Full HD</div>
  </div>

  <!-- Movie / Song Selection List -->
  <div class="list-title">ಇನ್ನಷ್ಟು ವೀಡಿಯೋಗಳು (Click to Watch)</div>
  <div class="movie-grid">

    <!-- Item 1: ನಿಮ್ಮ ಹಾಡು -->
    <div class="movie-card" onclick="changeMovie('-E0P159qjwk', 'ಮೌನದ ಅಲೆಗಳು (Mouna Nadi)', 'Kathu_764 Exclusive • Full HD')">
      <img src="https://img.youtube.com/vi/-E0P159qjwk/hqdefault.jpg" alt="Mouna Nadi">
      <div class="card-details">
        <div class="card-name">ಮೌನದ ಅಲೆಗಳು</div>
        <div class="card-tag">▶ ವೀಕ್ಷಿಸಿ (HD)</div>
      </div>
    </div>

    <!-- Item 2 -->
    <div class="movie-card" onclick="changeMovie('L_LUpnjgPso', 'ಆಕ್ಷನ್ ಸಿನಿಮಾ (Movie 2)', 'Special Feature • Full HD')">
      <img src="https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?w=400&q=80" alt="Movie 2">
      <div class="card-details">
        <div class="card-name">ಆಕ್ಷನ್ ಸಿನಿಮಾ 2</div>
        <div class="card-tag">▶ ವೀಕ್ಷಿಸಿ (HD)</div>
      </div>
    </div>

    <!-- Item 3 -->
    <div class="movie-card" onclick="changeMovie('kJQP7kiw5Fk', 'ರೊಮ್ಯಾಂಟಿಕ್ ಸಿನಿಮಾ (Movie 3)', 'Romantic Drama • Full HD')">
      <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80" alt="Movie 3">
      <div class="card-details">
        <div class="card-name">ಲವ್ ಸ್ಟೋರಿ 3</div>
        <div class="card-tag">▶ ವೀಕ್ಷಿಸಿ (HD)</div>
      </div>
    </div>

  </div>

  <script>
    function changeMovie(videoId, titleText, subText) {
      const player = document.getElementById('cinemaPlayer');
      const title = document.getElementById('playingTitle');
      const sub = document.getElementById('playingSub');
      
      // Update video and autoplay
      player.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1";
      title.innerText = titleText;
      sub.innerText = subText;

      // Smooth scroll to top for easy watching
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>

</body>
</html>
